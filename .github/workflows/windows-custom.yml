# Fork-only: build the custom Deskflow for the Windows dual-boot side (x64 MSI + portable zip).
# Same steps as the windows-2022-x64 target of continuous-integration.yml, without the rest of the matrix.

name: Windows custom build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/windows-custom.yml"

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PACKAGE_PREFIX: "deskflow"
    steps:
      - name: Fancy Checkout
        uses: sithlord48/fancy-checkout@v2

      - name: Setup VC++ environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: amd64
          spectre: true

      - name: Install dependencies
        id: get-deps
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: 6.12
          vcpkg-triplet: x64-windows-release

      - name: Get version
        uses: ./.github/actions/get-version

      - name: Configure
        run: cmake -Bbuild -DCMAKE_BUILD_TYPE=Release -DSKIP_BUILD_TESTS=ON -G Ninja ${{ steps.get-deps.outputs.vcpkg-cmake-config }} -DPACKAGE_VERSION_LABEL="${{env.DESKFLOW_PACKAGE_VERSION}}-custom"

      - name: Build
        shell: bash
        run: cmake --build build --config Release -j8 --target package

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: deskflow-custom-windows-x64
          path: ${{github.workspace}}/build/deskflow[-_]*.*
